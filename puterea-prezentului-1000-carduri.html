// Assign themes: 500 violet, 250 rose, 250 teal
const themeList = [];
for(let i=0;i<500;i++) themeList.push('v');
for(let i=0;i<250;i++) themeList.push('r');
for(let i=0;i<250;i++) themeList.push('t');
// shuffle
for(let i=themeList.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [themeList[i],themeList[j]]=[themeList[j],themeList[i]];
}

const ornaments2 = {v:'✦',r:'❋',t:'◈'};
let qrQueue = [];
let qrProcessing = false;

function processQRQueue(){
  if(qrProcessing||qrQueue.length===0) return;
  qrProcessing=true;
  const {elId,color} = qrQueue.shift();
  const el=document.getElementById(elId);
  if(el&&!el.dataset.done){
    el.dataset.done='1';
    try {
      new QRCode(el,{
        text:INSTAGRAM, width:52, height:52,
        colorDark:color, colorLight:'#ffffff',
        correctLevel:QRCode.CorrectLevel.M
      });
    } catch(e){}
  }
  setTimeout(()=>{qrProcessing=false;processQRQueue();},30);
}

let filtered = [];

function buildFiltered(){
  filtered = afirmatii.map((text,i)=>({
    id:i+1, text,
    theme:themeList[i],
    icon:icons[i%icons.length],
    cat:categories[Math.floor(i/100)%categories.length]
  })).filter(a=>{
    if(currentFilter!=='all'&&a.theme!==currentFilter) return false;
    if(searchTerm&&!a.text.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  });
}

function renderPage(){
  buildFiltered();
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(currentPage>totalPages) currentPage=1;

  const start=(currentPage-1)*PER_PAGE;
  const pageCards=filtered.slice(start,start+PER_PAGE);

  document.getElementById('counter').textContent=
    `Afișând ${start+1}–${Math.min(start+PER_PAGE,total)} din ${total} carduri`;

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  qrQueue=[];

  pageCards.forEach((a,idx)=>{
    const qrId=`qr-${a.id}`;
    const scene=document.createElement('div');
    scene.className=`card-scene ${a.theme}`;
    scene.style.opacity='0';
    scene.style.animation=`none`;
    scene.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="card-num">Afirmație · ${String(a.id).padStart(3,'0')}</div>
          <div class="card-orn">${ornaments2[a.theme]}</div>
          <p class="card-text">„${a.text}"</p>
          <div class="card-div"></div>
          <div class="card-brand">Puterea Prezentului</div>
        </div>
        <div class="card-face card-back">
          <div class="back-icon">${a.icon}</div>
          <div class="back-title">${a.cat.name}</div>
          <p class="back-desc">${a.text.length>80?a.text.substring(0,80)+'...':a.text}</p>
          <div class="back-tip">💡 ${a.cat.tip}</div>
          <div class="qr-wrap">
            <div class="qr-box" id="${qrId}"></div>
            <div class="qr-label">@alexandraa.dianaaa</div>
          </div>
        </div>
      </div>`;
    grid.appendChild(scene);

    // Fade in
    setTimeout(()=>{ scene.style.transition='opacity 0.4s ease'; scene.style.opacity='1'; },idx*25);

    // Queue QR
    const color=a.theme==='v'?'#4a2070':a.theme==='r'?'#c96070':'#0d4a5c';
    qrQueue.push({elId:qrId,color});
  });

  setTimeout(()=>processQRQueue(),200);
  renderPagination(totalPages);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPagination(totalPages){
  ['pagination','pagination2'].forEach(id=>{
    const el=document.getElementById(id);
    el.innerHTML='';
    if(totalPages<=1) return;

    const prev=document.createElement('button');
    prev.className='page-btn'; prev.textContent='← Prev';
    prev.disabled=currentPage===1;
    prev.onclick=()=>{if(currentPage>1){currentPage--;renderPage();}};
    el.appendChild(prev);

    const info=document.createElement('span');
    info.className='page-info';
    info.textContent=`Pag. ${currentPage} / ${totalPages}`;
    el.appendChild(info);

    // Show nearby pages
    const pages=[];
    pages.push(1);
    for(let p=Math.max(2,currentPage-2);p<=Math.min(totalPages-1,currentPage+2);p++) pages.push(p);
    if(totalPages>1) pages.push(totalPages);

    pages.forEach((p,i)=>{
      if(i>0&&pages[i]-pages[i-1]>1){
        const dots=document.createElement('span');
        dots.className='page-info'; dots.textContent='...';
        el.appendChild(dots);
      }
      const btn=document.createElement('button');
      btn.className='page-btn'+(p===currentPage?' active':'');
      btn.textContent=p;
      btn.onclick=(()=>{const pp=p;return()=>{currentPage=pp;renderPage();};})();
      el.appendChild(btn);
    });

    const next=document.createElement('button');
    next.className='page-btn'; next.textContent='Next →';
    next.disabled=currentPage===totalPages;
    next.onclick=()=>{if(currentPage<totalPages){currentPage++;renderPage();}};
    el.appendChild(next);
  });
}

function setFilter(f,btn){
  currentFilter=f; currentPage=1;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPage();
}

let searchTimeout;
function onSearch(){
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(()=>{
    searchTerm=document.getElementById('searchInput').value;
    currentPage=1; renderPage();
  },300);
}

window.addEventListener('DOMContentLoaded',()=>renderPage());
</script>
