<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puterea Prezentului – 100 Carduri</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --cream: #fdf8f2;
    --gold: #c9a96e;
    --violet-bg: linear-gradient(145deg, #2d1b4e 0%, #4a2070 40%, #7b3fa0 100%);
    --rose-bg: linear-gradient(135deg, #f9ddd3 0%, #f2b8a8 30%, #e08878 70%, #c96070 100%);
    --teal-bg: linear-gradient(150deg, #0d4a5c 0%, #1a7a82 40%, #4ab8a0 100%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1226;
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    padding: 40px 16px 80px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(123,94,167,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(74,155,142,0.12) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page-header {
    text-align: center;
    margin-bottom: 50px;
    position: relative; z-index: 1;
    animation: fadeUp 1s ease forwards;
  }
  .page-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--cream);
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .page-sub {
    font-size: 0.72rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }
  .deco { display: flex; align-items: center; gap: 14px; max-width: 280px; margin: 0 auto; }
  .deco span { flex:1; height:1px; background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent); }
  .deco em { font-family: 'Cormorant Garamond', serif; font-style:italic; font-size:0.85rem; color:rgba(201,169,110,0.55); white-space:nowrap; }

  /* NAV */
  .nav {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-bottom: 40px; position: relative; z-index: 1;
    animation: fadeUp 1s ease forwards 0.3s; opacity: 0;
  }
  .nav-btn {
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 9px 22px; border-radius: 30px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.6);
    transition: all 0.3s;
  }
  .nav-btn:hover, .nav-btn.active {
    background: rgba(201,169,110,0.15);
    border-color: rgba(201,169,110,0.4);
    color: var(--gold);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* CARD SCENE */
  .card-scene {
    perspective: 1000px;
    height: 400px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
    border-radius: 18px;
  }
  .card-scene:hover .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 28px;
  }
  .card-back { transform: rotateY(180deg); }

  /* ── VIOLET ── */
  .v .card-front {
    background: var(--violet-bg);
    border: 1px solid rgba(201,169,110,0.3);
    box-shadow: 0 18px 50px rgba(123,94,167,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .v .card-front::before {
    content:''; position:absolute; top:-50px; right:-50px;
    width:180px; height:180px;
    background: radial-gradient(circle, rgba(201,169,110,0.22) 0%, transparent 70%);
    border-radius:50%;
  }
  .v .card-back {
    background: linear-gradient(145deg, #1a0f35 0%, #2d1b4e 100%);
    border: 1px solid rgba(201,169,110,0.2);
    box-shadow: 0 18px 50px rgba(123,94,167,0.4);
  }

  /* ── ROSE ── */
  .r .card-front {
    background: var(--rose-bg);
    box-shadow: 0 18px 50px rgba(201,96,112,0.35);
  }
  .r .card-front::before {
    content:''; position:absolute;
    top:18px; left:18px; right:18px; bottom:18px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius:12px; pointer-events:none;
  }
  .r .card-back {
    background: linear-gradient(135deg, #fff5f2 0%, #fde8e0 100%);
    box-shadow: 0 18px 50px rgba(201,96,112,0.2);
  }

  /* ── TEAL ── */
  .t .card-front {
    background: var(--teal-bg);
    box-shadow: 0 18px 50px rgba(26,122,130,0.4);
  }
  .t .card-back {
    background: linear-gradient(150deg, #e8f7f5 0%, #c8ede8 100%);
    box-shadow: 0 18px 50px rgba(26,122,130,0.2);
  }

  /* FRONT ELEMENTS */
  .card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem; font-weight: 300;
    letter-spacing: 0.4em; text-transform: uppercase;
    margin-bottom: 16px; position: relative; z-index:1;
  }
  .v .card-num { color: var(--gold); }
  .r .card-num { color: rgba(255,255,255,0.65); }
  .t .card-num { color: rgba(255,255,255,0.55); }

  .card-ornament {
    font-size: 1.6rem; margin-bottom: 14px;
    position: relative; z-index:1; line-height:1;
  }

  .card-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 2.2vw, 1.22rem);
    font-weight: 400; line-height: 1.65;
    text-align: center; position: relative; z-index:1;
  }
  .v .card-text { color: #f0e8ff; font-style:italic; }
  .r .card-text { color: #fff; }
  .t .card-text { color: #e8faf8; font-style:italic; }

  .card-divider {
    width:36px; height:1px; margin:16px auto;
    position:relative; z-index:1;
  }
  .v .card-divider { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .r .card-divider { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); }
  .t .card-divider { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent); }

  .card-brand {
    font-family: 'Jost', sans-serif;
    font-size: 0.6rem; font-weight:300;
    letter-spacing: 0.32em; text-transform:uppercase;
    position:relative; z-index:1;
  }
  .v .card-brand { color: rgba(201,169,110,0.55); }
  .r .card-brand { color: rgba(255,255,255,0.45); }
  .t .card-brand { color: rgba(255,255,255,0.4); }

  /* BACK ELEMENTS */
  .back-icon { font-size:2rem; margin-bottom:12px; }
  .back-title {
    font-family:'Cormorant Garamond', serif;
    font-size:0.9rem; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase;
    margin-bottom:10px;
  }
  .back-desc {
    font-family:'Jost', sans-serif;
    font-size:0.76rem; font-weight:300;
    line-height:1.65; text-align:center;
    max-width:220px; margin-bottom:14px;
  }
  .back-tip {
    padding:9px 16px; border-radius:30px;
    font-family:'Jost', sans-serif;
    font-size:0.68rem; font-weight:400;
    letter-spacing:0.06em; text-align:center;
    margin-bottom: 12px;
  }
  /* QR container */
  .qr-wrap {
    margin-top: 4px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .qr-box {
    width: 56px; height: 56px;
    border-radius: 8px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-box canvas, .qr-box img { width:56px!important; height:56px!important; }
  .qr-label {
    font-family:'Jost', sans-serif;
    font-size:0.58rem; font-weight:300;
    letter-spacing:0.2em; text-transform:uppercase;
  }

  .v .back-title { color: #7b5ea7; }
  .v .back-desc  { color: #4a3570; }
  .v .back-tip   { background: rgba(123,94,167,0.1); color:#7b5ea7; border:1px solid rgba(123,94,167,0.22); }
  .v .qr-box     { background: #fff; }
  .v .qr-label   { color: rgba(123,94,167,0.6); }

  .r .back-title { color: #c96070; }
  .r .back-desc  { color: #7a3a45; }
  .r .back-tip   { background: rgba(201,96,112,0.1); color:#c96070; border:1px solid rgba(201,96,112,0.22); }
  .r .qr-box     { background: #fff; }
  .r .qr-label   { color: rgba(201,96,112,0.6); }

  .t .back-title { color: #1a7a82; }
  .t .back-desc  { color: #1a5a55; }
  .t .back-tip   { background: rgba(74,155,142,0.1); color:#1a7a82; border:1px solid rgba(74,155,142,0.22); }
  .t .qr-box     { background: #fff; }
  .t .qr-label   { color: rgba(26,122,130,0.6); }

  /* COUNTER */
  .counter {
    text-align:center; margin-bottom: 28px;
    font-family:'Cormorant Garamond', serif;
    font-size:0.85rem; font-weight:300;
    color:rgba(201,169,110,0.5);
    letter-spacing:0.2em;
    position:relative; z-index:1;
    animation: fadeUp 0.8s ease forwards 0.5s; opacity:0;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .hint {
    text-align:center;
    font-size:0.68rem; font-weight:300;
    letter-spacing:0.25em; text-transform:uppercase;
    color:rgba(255,255,255,0.25);
    margin-top:40px;
    position:relative; z-index:1;
  }

  @media print {
    body { background: white; padding: 10px; }
    .nav, .hint, .page-header { display:none; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card-scene { opacity:1; animation:none; height:340px; }
    .card-inner { transform: none!important; }
    .card-back { display:none; }
  }
</style>
</head>

<div class="page-header">

// Theme distribution: mix aleatoriu cu ~34 violet, ~33 rose, ~33 teal
const themes = [];
for(let i=0;i<34;i++) themes.push('v');
for(let i=0;i<33;i++) themes.push('r');
for(let i=0;i<33;i++) themes.push('t');
// shuffle
for(let i=themes.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [themes[i],themes[j]]=[themes[j],themes[i]];
}

const ornaments = { v:'✦', r:'❋', t:'◈' };

function buildCards(filter='all') {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const counter = document.getElementById('counter');

  let shown = 0;
  afirmatii.forEach((a, idx) => {
    const theme = themes[idx];
    if(filter !== 'all' && filter !== theme) return;
    shown++;

    const scene = document.createElement('div');
    scene.className = `card-scene ${theme}`;
    scene.style.animationDelay = (shown * 0.04) + 's';

    const qrId = `qr-${a.id}`;

    scene.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="card-num">Afirmație · ${String(a.id).padStart(2,'0')}</div>
          <div class="card-ornament">${ornaments[theme]}</div>
          <p class="card-text">„${a.text}"</p>
          <div class="card-divider"></div>
          <div class="card-brand">Puterea Prezentului</div>
        </div>
        <div class="card-face card-back">
          <div class="back-icon">${a.icon}</div>
          <div class="back-title">Practică</div>
          <p class="back-desc">${a.desc}</p>
          <div class="back-tip">💡 ${a.tip}</div>
          <div class="qr-wrap">
            <div class="qr-box" id="${qrId}"></div>
            <div class="qr-label">@alexandraa.dianaaa</div>
          </div>
        </div>
      </div>
    `;
    grid.appendChild(scene);

    // Generate QR after DOM insert
    setTimeout(() => {
      const el = document.getElementById(qrId);
      if(el && !el.dataset.done) {
        el.dataset.done = '1';
        new QRCode(el, {
          text: INSTAGRAM,
          width: 56, height: 56,
          colorDark: theme === 'v' ? '#4a2070' : theme === 'r' ? '#c96070' : '#0d4a5c',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }, 100);
  });

  const labels = { all: 'toate 100', v:'cele 34 Violet', r:'cele 33 Roz', t:'cele 33 Teal' };
  counter.textContent = `Afișând ${labels[filter]} de carduri`;
}

function filterCards(f) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  buildCards(f);
}

window.addEventListener('DOMContentLoaded', () => buildCards('all'));
